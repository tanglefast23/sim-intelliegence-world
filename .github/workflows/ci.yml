name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.1
          cache: npm

      - name: Prove tested SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'tested_sha=%s\n' "$GITHUB_SHA"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify current phase build
        run: npm run verify:ci-build

      - name: Configure packaged Chromium sandbox
        run: |
          sandbox_path='out/si-world-linux-x64/chrome-sandbox'
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%u:%g:%a' "$sandbox_path")" = '0:0:4755'

      - name: Verify packaged Linux shell
        env:
          SI_WORLD_SMOKE_SOFTWARE_RENDERING: '1'
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: xvfb-run -a npm run smoke:electron

      - name: Verify Linux natural movement
        env:
          SI_WORLD_SMOKE_SOFTWARE_RENDERING: '1'
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: xvfb-run -a npm run smoke:natural-movement -- artifacts/phase-23/linux-x64/natural-movement

      - name: Verify Linux responsive matrix
        env:
          SI_WORLD_SMOKE_SOFTWARE_RENDERING: '1'
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: xvfb-run -a -s "-screen 0 3200x1800x24" npm run smoke:responsive -- artifacts/phase-22/linux-x64/responsive

      - name: Verify Linux presentation restart
        env:
          SI_WORLD_SMOKE_SOFTWARE_RENDERING: '1'
        run: xvfb-run -a npm run smoke:presentation-restart

      - name: Verify Linux v5 save migration and reload
        env:
          SI_WORLD_SMOKE_SOFTWARE_RENDERING: '1'
        run: xvfb-run -a npm run smoke:save-migration

  package-macos-intel:
    name: package-macos-intel
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.1
          cache: npm

      - name: Prove tested SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'tested_sha=%s\n' "$GITHUB_SHA"

      - name: Install locked dependencies
        run: npm ci

      - name: Package Intel macOS shell
        run: npm run package:mac:x64

      - name: Apply and verify ad-hoc test signature
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run sign:test:mac

      - name: Smoke Intel macOS shell without model qualification claims
        env:
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: npm run smoke:electron -- artifacts/phase-14/macos-x64/current

      - name: Verify Intel macOS natural movement
        env:
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: npm run smoke:natural-movement -- artifacts/phase-23/macos-x64/natural-movement

      - name: Verify Intel macOS responsive matrix
        env:
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: npm run smoke:responsive -- artifacts/phase-22/macos-x64/responsive

      - name: Verify Intel macOS presentation restart
        run: npm run smoke:presentation-restart -- artifacts/phase-22/macos-x64/presentation-restart

      - name: Verify Intel macOS v5 save migration and reload
        run: npm run smoke:save-migration -- artifacts/phase-22/macos-x64/save-migration

  package-windows-x64:
    name: package-windows-x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.1
          cache: npm

      - name: Prove tested SHA
        shell: powershell
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checked-out commit does not match GITHUB_SHA.' }
          Write-Output "tested_sha=$env:GITHUB_SHA"

      - name: Install locked dependencies
        run: npm ci

      - name: Package Windows x64 shell
        run: npm run package:windows:x64

      - name: Apply and verify local self-signed test signature
        shell: powershell
        timeout-minutes: 2
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/qualification/sign-windows-test.ps1

      - name: Smoke Windows x64 shell without model qualification claims
        env:
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: npm run smoke:electron -- artifacts/phase-14/windows-x64/current

      - name: Verify Windows natural movement
        env:
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: npm run smoke:natural-movement -- artifacts/phase-23/windows-x64/natural-movement

      - name: Verify Windows x64 responsive matrix
        env:
          SI_WORLD_SMOKE_PROFILE: platform-shell
        run: npm run smoke:responsive -- artifacts/phase-22/windows-x64/responsive

      - name: Verify Windows x64 presentation restart
        run: npm run smoke:presentation-restart -- artifacts/phase-22/windows-x64/presentation-restart

      - name: Verify Windows x64 v5 save migration and reload
        run: npm run smoke:save-migration -- artifacts/phase-22/windows-x64/save-migration
