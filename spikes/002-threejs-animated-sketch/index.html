<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three.js Animated Sketch</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #14100f;
      color: #f7e7d2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, #4a2720 0, transparent 45%),
        #14100f;
    }
    main {
      width: min(94vw, 820px);
      display: grid;
      grid-template-columns: minmax(280px, 455px) minmax(220px, 1fr);
      gap: 28px;
      align-items: center;
      padding: 28px;
    }
    #portrait {
      width: 100%;
      aspect-ratio: 455 / 666;
      overflow: hidden;
      border: 2px solid #ecb875;
      background: #e65b12;
      box-shadow: 0 24px 70px #0009;
      cursor: pointer;
    }
    #portrait canvas { display: block; width: 100%; height: 100%; }
    h1 { margin: 0 0 12px; font-size: clamp(20px, 3vw, 32px); line-height: 1; }
    p { color: #cfb9a5; font-size: 12px; line-height: 1.6; }
    ol { margin: 22px 0; padding-left: 24px; font-size: 11px; line-height: 1.8; }
    button {
      min-height: 42px;
      border: 1px solid #ecb875;
      padding: 0 14px;
      color: #fff2dc;
      background: #2d1c19;
      font: inherit;
      cursor: pointer;
    }
    button + button { margin-left: 8px; }
    .hint { margin-top: 14px; color: #a79180; font-size: 10px; }
    @media (max-width: 680px) {
      main { grid-template-columns: 1fr; width: min(96vw, 500px); padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div id="portrait" role="img" aria-label="Animated procedural sketch of a blue-haired character"></div>
    <section>
      <h1>ANIMATED SKETCH</h1>
      <p>Every visible part is drawn by JavaScript into its own canvas texture.</p>
      <ol>
        <li>orange paper</li>
        <li>back hair</li>
        <li>neck and shirt</li>
        <li>face and ears</li>
        <li>eyes and brows</li>
        <li>nose and mouth</li>
        <li>front hair</li>
      </ol>
      <button id="mood" type="button">CHANGE MOOD</button>
      <button id="layers" type="button" aria-pressed="false">EXPLODE LAYERS</button>
      <p class="hint">Move the pointer to guide her eyes. Click the portrait to change her mood.</p>
    </section>
  </main>
  <script defer src="./scene.bundle.js"></script>
</body>
</html>
